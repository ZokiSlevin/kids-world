<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c43">
  <meta name="description" content="Kids World - dvanaest igara za učenje, kreativnost i zabavu, bez reklama.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kids World">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=1.0.4">
  <title>Kids World v1.0.4 | Uči, igraj se i istražuj</title>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <button class="brand" data-nav="home" aria-label="Kids World početna"><span class="brand-mark">✦</span><span>KIDS<span class="brand-accent">WORLD</span><small>MALI SVIJET VELIKIH IDEJA</small></span></button>
      <nav class="nav" aria-label="Glavni izbornik">
        <button data-nav="home" class="nav-btn active"><span>⌂</span>Početna</button>
        <button data-nav="games" class="nav-btn"><span>✧</span>Igre</button>
        <button data-nav="connected" class="nav-btn"><span>✦</span>Moj svijet</button>
        <button data-nav="rewards" class="nav-btn"><span>★</span>Nagrade</button>
        <button data-nav="progress" class="nav-btn"><span>▥</span>Napredak</button>
        <button data-nav="parents" class="nav-btn"><span>&#9678;</span>Roditeljski kutak</button>
        <button data-nav="settings" class="nav-btn"><span>⚙</span>Postavke</button>
      </nav>
      <div class="side-bottom"><div class="offline"><i></i> Lokalno spremanje</div><span>Kids World · v1.0.4</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><span class="mobile-logo">✦ KIDS<span class="brand-accent">WORLD</span></span><div class="eyebrow" id="sectionLabel">TVOJ SVIJET IGRE</div></div><div class="top-actions"><span class="build-label" title="Mobile Edition">v1.0.4</span><button id="screenMode" class="screen-mode" type="button" aria-label="Cijeli zaslon" title="Cijeli zaslon" aria-pressed="false">⛶</button><span class="star-pill" title="Zvjezdice">★ <b id="starTotal">0</b></span><button id="profileButton" class="profile-button" aria-label="Promijeni profil"><span id="profileAvatar">🦊</span><span id="profileName">Igrač</span><span class="chevron">⌄</span></button></div></header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
    <nav class="bottom-nav" aria-label="Mobilni izbornik"><button data-nav="home" class="active"><span>⌂</span>Početna</button><button data-nav="games"><span>✧</span>Igre</button><button data-nav="rewards"><span>★</span>Nagrade</button><button data-nav="progress"><span>▥</span>Napredak</button><button data-nav="settings"><span>⚙</span>Postavke</button></nav>
  </div>
  <dialog id="modal" class="modal"><div id="modalBody"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="mobile.js?v=1.0.4" defer></script>
  <script src="journey.js?v=1.0.4" defer></script>
  <script src="rewards.js?v=1.0.4" defer></script>
  <script src="family.js?v=1.0.4" defer></script>
  <script src="previews.js?v=1.0.4" defer></script>
  <script src="app.js?v=1.0.4" defer></script>
  <script src="games.js?v=1.0.4" defer></script>
  <script src="adventure.js?v=1.0.4" defer></script>
  <script src="discovery.js?v=1.0.4" defer></script>
  <script src="playground.js?v=1.0.4" defer></script>
  <script src="universe.js?v=1.0.4" defer></script>
  <script src="dino-life.js?v=1.0.4" defer></script>
  <script src="learning.js?v=1.0.4" defer></script>
  <script src="fun.js?v=1.0.4" defer></script>
  <script src="connected.js?v=1.0.4" defer></script>
</body>
</html>
